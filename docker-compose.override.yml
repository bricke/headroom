# Local override for capability-aware backend routing smoke tests.
# Copy to docker-compose.override.yml and fill in your values.
# Skips qdrant/neo4j so only the proxy runs (stateless mode).
# See docs/design/local-frontier-routing.md for full setup instructions.
services:
  headroom-proxy:
    build:
      context: .
      args:
        HEADROOM_EXTRAS: proxy,code,anyllm
    depends_on: []
    environment:
      - HEADROOM_HOST=0.0.0.0
      - HEADROOM_STATELESS=true
      - HEADROOM_ROUTING_ENABLED=true
      - HEADROOM_ROUTING_PREFER=selfhosted
      - HEADROOM_ANYLLM_PROVIDER=openai
      - HEADROOM_ROUTING_SELFHOSTED_API_BASE=http://your-local-llm-host:8080/v1
      - HEADROOM_ROUTING_SELFHOSTED_API_KEY=your-api-key-or-placeholder
      - HEADROOM_ROUTING_SELFHOSTED_MODEL=your-local-model-name
